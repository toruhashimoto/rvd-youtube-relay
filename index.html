<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>RVD YouTube Relay</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
// Generic YouTube player relay for Race Viewing Dashboard.
// The extension page cannot embed YouTube directly (Error 153: no Referer from
// chrome-extension://), so it frames this HTTPS page, which embeds the official
// player via the official IFrame API and relays commands/events over postMessage.
// No race data passes through here. Usage: index.html?v=<videoId>
;(function () {
  const params = new URLSearchParams(location.search)
  const videoId = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '')
  const toParent = (msg) => {
    if (window.parent !== window) window.parent.postMessage({ source: 'rvd-relay', ...msg }, '*')
  }
  let player = null
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => toParent({ type: 'ready', videoId }),
        onStateChange: (e) => toParent({ type: 'state', state: e.data }),
        onError: (e) => toParent({ type: 'error', code: e.data }),
      },
    })
    setInterval(() => {
      if (player && player.getCurrentTime) {
        toParent({ type: 'time', currentTime: player.getCurrentTime(), duration: player.getDuration() })
      }
    }, 1000)
  }
  const ALLOWED = new Set(['playVideo', 'pauseVideo', 'mute', 'unMute', 'seekTo', 'setVolume'])
  window.addEventListener('message', (e) => {
    if (e.source !== window.parent || !player) return
    const d = e.data
    if (!d || d.target !== 'rvd-relay' || !ALLOWED.has(d.command)) return
    player[d.command](...(Array.isArray(d.args) ? d.args : []))
  })
  const s = document.createElement('script')
  s.src = 'https://www.youtube.com/iframe_api'
  document.head.appendChild(s)
})()
</script>
</body>
</html>
